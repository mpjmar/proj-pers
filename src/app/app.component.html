<h1>{{ this.titulo }}</h1>
<div>
  <button (click)="onConectarDesconectarVivienda()">
    {{ corrienteGeneral ? "Desconectar" : "Conectar" }}
  </button>
  <span
    >Corriente General:
    {{ corrienteGeneral ? "CONECTADA" : "DESCONECTADA" }}
  </span>
</div>
<div>
  <button
    [disabled]="!corrienteGeneral"
    (click)="onConectarDesconectarHabitacion()"
  >
    {{ corrienteHabitacion ? "Desconectar habitación" : "Conectar habitación" }}
  </button>
  <span
    >Estado recibido: PERSIANA
    {{ persianaAbierta ? "ABIERTA" : "CERRADA" }}
  </span>
</div>

<app-habitacion
  [corrienteGeneral]="corrienteGeneral"
  [corrienteHabitacion]="corrienteHabitacion"
  (persianaAbierta)="recibirEstadoPersiana($event)"
></app-habitacion>
