<h1>{{ this.titulo }}</h1>
<div>
  <button (click)="onConectarDesconectarVivienda()">Conectar</button>
  <span
    >Corriente General:
    {{ corrienteGeneral ? "CONECTADA" : "DESCONECTADA" }}
  </span>
</div>
<div>
  <button
    [disabled]="!corrienteGeneral"
    (click)="onConectarDesconectarHabitacion($event)"
  >
    {{
      corrienteHabitacion ? "Desconectar habitación" : "Desconectar habitación"
    }}
  </button>
  <span
    >Estado recibido: PERSIANA
    {{ persianaAbierta() ? "ABIERTA" : "CERRADA" }}
  </span>
</div>

<app-habitacion
  [corrienteGeneral]="corrienteGeneral"
  [corrienteHabitacion]="corrienteHabitacion"
></app-habitacion>
