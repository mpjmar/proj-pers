<h1>{{ this.titulo }}</h1>
<div>
  <button (click)="onConectarDesconectarVivienda($event)">Conectar</button>
  <span
    >Corriente General:
    {{ corrienteGeneral ? "CONECTADA" : "DESCONECTADA" }}
  </span>
</div>
<div>
  <button
    [disabled]="!corrienteGeneral"
    (click)="onConectarDesconectarHabitacion($event)"
  >
    Conectar habitación
  </button>
  <span
    >Estado recibido: PERSIANA
    {{ estadoPersiana ? "ABIERTA" : "CERRADA" }}
  </span>
</div>

<app-habitacion [corrienteGeneral]="corrienteGeneral"></app-habitacion>
